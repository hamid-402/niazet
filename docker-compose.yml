services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: niazat
    ports:
      - '5432:5432'
    volumes:
      - niazat_postgres_data:/var/lib/postgresql/data

volumes:
  niazat_postgres_data:
